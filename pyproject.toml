[project]
name = "library-catalog"
version = "0.1.0"
description = ""
authors = [
    {name = "Goose",email = "dmitry.obukhov2014@gmail.com"}
]
requires-python = ">=3.11.9,<4.0"
dependencies = [
    "fastapi (>=0.151.0,<0.152.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
  \.venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F",   # pycodestyle + pyflakes
  "I",        # сортировка импортов
  "UP",       # современный синтаксис Python
  "B",        # flake8-bugbear
  "ASYNC",    # ошибки в async-коде
  "SIM",      # упрощение кода
]
ignore = [
  "E501",     # длину строк контролирует Black
]
